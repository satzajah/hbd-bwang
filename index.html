<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HABEDE BWANG</title>
  <style>
    body {
      background: linear-gradient(to top, #fff1f7, #ffe3ee);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Comic Sans MS', sans-serif;
    }

    .birthday-title {
      font-size: 28px;
      font-weight: bold;
      color: #d6336c;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 1s ease, transform 0.5s ease;
    }

    .birthday-title.show {
      opacity: 1;
      transform: translateY(0);
    }

    .cake-container {
      position: relative;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cake-layer {
      width: 220px;
      height: 50px;
      border-radius: 10px;
      margin-top: -14px;
      opacity: 0;
      transform: translateY(-200px);
      transition: transform 0.6s ease, opacity 0.4s ease;
      box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.1);
      position: relative;
    }

    .cake-layer::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 8px;
      width: 100%;
      border-radius: 10px 10px 0 0;
      background: rgba(255,255,255,0.4);
    }

    .layer1 { background: linear-gradient(#f78ca0, #f9748f); z-index: 4; }
    .layer2 { background: linear-gradient(#f8b195, #f67280); z-index: 3; }
    .layer3 { background: linear-gradient(#fcd5ce, #fae1dd); z-index: 2; }
    .layer4 { background: linear-gradient(#ffdac1, #ffe5b4); z-index: 1; }

    .cake-layer.show {
      opacity: 1;
      transform: translateY(0);
    }

    .candle-number {
      font-size: 40px;
      color: #fff176;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      position: relative;
      display: flex;
      gap: 10px;
      opacity: 0;
      transform: translateY(-200px);
      transition: transform 0.6s ease, opacity 0.4s ease;
    }

    .candle-number.show {
      opacity: 1;
      transform: translateY(0);
    }

    .digit {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .wick {
      width: 2px;
      height: 6px;
      background: #333;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 1px;
    }

    .flame {
      width: 10px;
      height: 10px;
      background: radial-gradient(ellipse at center, #fff3cd 0%, #ff9800 60%, #e65100 100%);
      border-radius: 50%;
      position: absolute;
      top: 1px;
      left: 50%;
      transform: translateX(-50%);
      animation: flicker 0.2s infinite;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
      50% { transform: translateX(-50%) scale(1.1); opacity: 1; }
      100% { transform: translateX(-50%) scale(1); opacity: 0.85; }
    }

    .birthday-message {
      margin-top: 30px;
      font-size: 20px;
      color: #d6336c;
      opacity: 0;
      transition: opacity 1s ease;
      text-align: center;
      font-weight: bold;
    }

    .birthday-message.show {
      opacity: 1;
    }

    .wish-form {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .wish-form.show {
      opacity: 1;
    }

    .wish-input {
      padding: 8px 12px;
      border: 2px solid #f78ca0;
      border-radius: 8px;
      font-size: 16px;
      width: 260px;
      margin-bottom: 10px;
    }

    .wish-button {
      padding: 6px 16px;
      background-color: #f78ca0;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .wish-button:hover {
      background-color: #f45b89;
    }
  </style>

  <!-- EmailJS SDK v4 (aman & tidak deprecated) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

  <div class="birthday-title" id="birthdayTitle">
    🎂 Selamat Ulang Tahun ke-15! 🎉
  </div>

  <div class="cake-container">
    <div class="candle-number" id="candle">
      <div class="digit">
        1
        <div class="wick"></div>
        <div class="flame"></div>
      </div>
      <div class="digit">
        5
        <div class="wick"></div>
        <div class="flame"></div>
      </div>
    </div>

    <div class="cake-layer layer1" id="layer1"></div>
    <div class="cake-layer layer2" id="layer2"></div>
    <div class="cake-layer layer3" id="layer3"></div>
    <div class="cake-layer layer4" id="layer4"></div>
  </div>

  <div class="birthday-message" id="wishText">
    Apa keinginanmu untuk ulang tahunmu ke-15?
  </div>

  <form class="wish-form" id="wishForm">
    <input type="text" class="wish-input" id="wishInput" name="message" placeholder="Tulis keinginanmu di sini..." required />
    <button class="wish-button" type="submit">Kirim</button>
  </form>

  <script>
    emailjs.init("2iMw6il-MiygIAZph"); // Ganti dengan PUBLIC KEY milikmu

    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("wishForm");

      // Animasi lapisan kue
      function dropLayer(id, delay) {
        setTimeout(() => {
          document.getElementById(id).classList.add('show');
        }, delay);
      }

      dropLayer("layer4", 500);
      dropLayer("layer3", 1000);
      dropLayer("layer2", 1500);
      dropLayer("layer1", 2000);
      dropLayer("candle", 2500);

      // Tampilkan judul dan form
      setTimeout(() => {
        document.getElementById("birthdayTitle").classList.add("show");
        document.getElementById("wishText").classList.add("show");
        form.classList.add("show");
      }, 3200);

      // Kirim form via EmailJS
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const wish = document.getElementById("wishInput").value;

        emailjs.send("service_gmail123", "template_abc123", {
          message: wish
        })
        .then(() => {
          alert("Pesan sudah terkirim 🎉");
          document.getElementById("wishInput").value = "";
        }, (err) => {
          alert("Gagal mengirim: " + JSON.stringify(err));
        });
      });
    });
  </script>

</body>
</html>
